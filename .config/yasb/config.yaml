# Bar For GlazeWM
watch_stylesheet: True
watch_config: True
debug: False
update_check: False
show_systray: True
glazewm:
  start_command: "glazewm.exe start"
  stop_command: "glazewm.exe command wm-exit"
  reload_command: "glazewm.exe command wm-exit && glazewm.exe start"
bars:
  primary-bar:
    enabled: True
    screens: ["*"]
    class_name: "yasb-bar dark"
    alignment:
      position: "top"
      align: "center"
    animation:
      enabled: False
      duration: 0
    blur_effect:
      enabled: False
      dark_mode: False
      round_corners: False
      border_color: None
    window_flags:
      always_on_top: False
      windows_app_bar: True
      hide_on_fullscreen: True
      hide_on_maximized: True
      auto_hide: False
    layouts:
      left:
        alignment: "left"
        stretch: True
      center:
        alignment: "center"
        stretch: True
      right:
        alignment: "right"
        stretch: True
    dimensions:
      width: "100%"
      height: 32
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        [
          "power_menu",
          "lines",
          "glazewm_workspaces",
          "glazewm_tiling_direction",
          "lines",
          "taskbar",
        ]
      center: ["open_meteo", "lines", "clock"]
      right:
        [
          "systray",
          "cpu",
          "memory",
          "lines",
          "battery",
          "lines",
          "volume",
          "microphone",
          "lines",
          "notifications",
          "wallpapers",
          "wifi",
          "notes",
          "media",
        ]
widgets:
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 12
      tooltip: False
      show_only_visible: False
      strict_filtering: True
      monitor_exclusive: True
      animation:
        enabled: False
        duration: 0
      preview:
        enabled: False
      title_label:
        enabled: False

  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "Min {min_temp} Max {max_temp} Hum {humidity}"
      update_interval: 600
      hide_decimal: True
      units: "metric"
      tooltip: False
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\ue312"
        cloudyNight: "\ue311"
        drizzleDay: "󰙾"
        drizzleNight: "󰙾"
        rainyDay: "\ue308"
        rainyNight: "\ue333"
        snowyDay: "\ue30a"
        snowyNight: "\ue335"
        foggyDay: "\ue303"
        foggyNight: "\ue346"
        thunderstormDay: "\ue30f"
        thunderstormNight: "\ue338"
        default: "\uebaa"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      weather_card:
        blur: False
        round_corners: False
        border_color: "none"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 179
        icon_size: 48
        show_hourly_forecast: True
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 24
        icon_smoothing: True
        temp_line_width: 2
        current_line_color: "#8A8A8A"
        current_line_width: 2
        current_line_style: "dot"
        hourly_gradient:
          enabled: False
          top_color: "#7C7C7C"
          bottom_color: "#1D1D1D"
        hourly_forecast_buttons:
          enabled: True
          default_view: "temperature"
          temperature_icon: "󰖙"
          rain_icon: "󰖖"
          snow_icon: "󰖘"
        weather_animation:
          enabled: True
          snow_overrides_rain: True
          temp_line_animation_style: both
          rain_effect_intensity: 1.0
          snow_effect_intensity: 1.0
          scale_with_chance: True

  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "|"
      label_alt: "|"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"

  notes:
    type: "yasb.notes.NotesWidget"
    options:
      label: "<span>󰺿</span>"
      start_floating: False
      paste_plain_text: True
      menu:
        blur: False
        round_corners: False
        border_color: "None"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 86
        max_title_size: 150
        show_date_time: True
      icons:
        note: "󰤌"
        delete: "󰧧"
        copy: "\uf4bb"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{count} New</span>"
      hide_empty: False
      icons:
        new: "󰂟"
        default: "󰂜"
      tooltip: False
      callbacks:
        on_left: "toggle_notification"
        on_right: "toggle_label"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span> {virtual_mem_percent}%"
      label_alt: "<span>\uefc5</span> {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000
      hide_decimal: True
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      memory_thresholds:
        low: 20
        medium: 60
        high: 90
      menu:
        enabled: True
        show_graph: True
        show_graph_grid: True
        graph_history_size: 60
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 120

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]:.0f}%"
      label_alt: "<span>\uf4bc</span> {info[freq][current]} GHz"
      update_interval: 1000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: True
        show_graph: True
        show_graph_grid: True
        graph_history_size: 60
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 120

  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>󰸉</span>"
      image_path: "$env:USERPROFILE/Pictures/Wallpapers/Home Screen"
      change_automatically: False
      update_interval: 81400
      tooltip: False
      gallery:
        enabled: True
        blur: False
        image_width: 250
        image_per_page: 7
        gallery_columns: 0
        horizontal_position: "center"
        vertical_position: "center"
        position_offset: 0
        respect_work_area: True
        show_buttons: False
        orientation: "portrait"
        image_spacing: 12
        lazy_load: False
        lazy_load_fadein: 0
        image_corner_radius: 0

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf47c"
      label_expanded: "\uf47b"
      label_position: "left"
      icon_size: 12
      pin_click_modifier: "ctrl"
      show_unpinned: True
      show_unpinned_button: False
      show_in_popup: True
      icons_per_row: 4
      use_hook: True
      popup:
        blur: False
        round_corners: False
        border_color: "None"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 75
      show_battery: False
      show_volume: False
      show_network: False

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "<span>\uf05e</span>"
      hide_if_offline: False
      monitor_exclusive: False
      enable_scroll_switching: False

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "󰓡"
      vertical_label: "󰓢"

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{title} - {artist}"
      max_field_size:
        label: 24
        label_alt: 30
      hide_empty: False
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "toggle_label"
      show_thumbnail: True
      thumbnail_alpha: 220
      thumbnail_padding: 6
      thumbnail_corner_radius: 4
      symmetric_corner_radius: True
      thumbnail_edge_fade: True
      controls_only: False
      controls_left: False
      controls_hide: True
      media_menu:
        blur: False
        round_corners: False
        border_color: "None"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: -19
        thumbnail_corner_radius: 0
        thumbnail_size: 140
        max_title_size: 80
        max_artist_size: 20
        show_source: True
      media_menu_icons:
        play: "󰼛"
        pause: "󰏤"
        prev_track: "󰼨"
        next_track: "󰼧"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}"
      label_alt: "{%A %d %B %Y %H:%M}"
      tooltip: False
      calendar:
        blur: False
        round_corners: False
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: -3
        border_color: None
        show_holidays: True
        holiday_color: "#FF6E00"
        country_code: "BR"
        extended: True

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 1000
      callbacks:
        on_left: "exec quick_settings"
        on_middle: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:network"
      ethernet_label: "<span>\ue839</span>"
      wifi_icons: ["\uf384", "\uec3f", "\uec3f", "\uec3f", "\uec3f"]

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      tooltip: False
      mute_text: ""
      volume_icons:
        - "\uf466"
        - "\uf485"
        - "\uf485"
        - "\uf485"
        - "\uf485"
      audio_menu:
        blur: False
        round_corners: False
        border_color: "None"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 80
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"

  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "<span>\uf130</span>"
      label_alt: "<span>\uf131</span> {level}"
      icons:
        normal: "\uf130"
        muted: "\uf131"
      mic_menu:
        blur: False
        round_corners: False
        border_color: "None"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 80
      callbacks:
        on_left: "toggle_mic_menu"
        on_middle: "toggle_label"
        on_right: "toggle_mute"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "Pow:{power}W HP:{health}%"
      update_interval: 5000
      hide_unsupported: True
      time_remaining_natural: False
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: False
      status_thresholds:
        critical: 10
        low: 25
        medium: 50
        high: 80
        full: 100
      status_icons:
        icon_charging: "󱐌"
        icon_critical: "\uecbb"
        icon_low: "\uecbc"
        icon_medium: "\uecbd"
        icon_high: "\uecbe"
        icon_full: "\uecbf"

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\ue62a"
      uptime: True
      show_user: True
      profile_image_size: 72
      menu_style: "popup"
      popup:
        blur: False
        round_corners: False
        border_color: "None"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 3
      buttons:
        restart: ["\uead2", "Restart"]
        lock: ["\uf456", "Lock"]
        sleep: ["\uf4ee", "Sleep"]
        signout: ["\uf08b", "Sign out"]
        shutdown: ["\uf011", "Shut Down"]
        cancel: ["󰜺", "Cancel"]

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[app_name]}"
      label_no_window: ""
      label_alt: "{win[process]}"
      label_icon: False
      max_length: 75
      max_length_ellipsis: ""
      monitor_exclusive: False
      callbacks:
        on_left: "do_nothing"
