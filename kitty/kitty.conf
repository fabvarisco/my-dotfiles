include ./mocha.conf
include ~/.cache/kitty/current-theme.conf
font_family      jetbrains mono nerd font
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
# Same black as Cursor's Dark Modern chrome. Opaque so the wallpaper
# does not shift the tone.
background              #181818
background_opacity      1
# Kitty 0.45+ restores the last OS window state. A maximized window
# covers the whole workspace and looks like a special workspace.
remember_window_size no
