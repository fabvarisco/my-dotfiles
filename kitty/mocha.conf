# vim:ft=kitty

## name:     Gray Monochrome (matches Waybar)
## blurb:    Minimal gray palette matching waybar theme

# The basic colors
foreground              #e0e0e0
background              #1a1a1a
selection_foreground    #1a1a1a
selection_background    #d0d0d0

# Cursor colors
cursor                  #d0d0d0
cursor_text_color       #1a1a1a

# URL underline color when hovering with mouse
url_color               #a0a0a0

# Kitty window border colors
active_border_color     #888888
inactive_border_color   #505050
bell_border_color       #cc6666

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1a1a1a
active_tab_background   #d0d0d0
inactive_tab_foreground #a0a0a0
inactive_tab_background #505050
tab_bar_background      #1a1a1a

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1a1a
mark1_background #d0d0d0
mark2_foreground #1a1a1a
mark2_background #a0a0a0
mark3_foreground #1a1a1a
mark3_background #808080

# The 16 terminal colors

# black
color0 #1a1a1a
color8 #505050

# red
color1 #cc6666
color9 #cc6666

# green
color2  #a0a0a0
color10 #b0b0b0

# yellow
color3  #b0b0b0
color11 #d0d0d0

# blue
color4  #666666
color12 #808080

# magenta
color5  #888888
color13 #a0a0a0

# cyan
color6  #808080
color14 #a0a0a0

# white
color7  #d0d0d0
color15 #ffffff
