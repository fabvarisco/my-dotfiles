#####################
### HYPRIDLE CONF ###
#####################

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150                                # 2.5 min
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum
    on-resume = brightnessctl -r                 # restore monitor backlight
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150                                          # 2.5 min
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight
}

# Lock screen after 5 minutes
listener {
    timeout = 300                                # 5 min
    on-timeout = loginctl lock-session           # lock screen
}

# Turn off display after 5.5 minutes
listener {
    timeout = 330                                # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 30 minutes
listener {
    timeout = 1800                               # 30 min
    on-timeout = systemctl suspend               # suspend system
}
