#? Config file for btop v. 1.2.13

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Themes should be placed in "../share/btop/themes" or "$HOME/.config/btop/themes".
color_theme = "cursor-dark"

#* If the theme set background should be shown, set to False if you want terminal background transparency.
#* Keep True so Cursor's light terminal theme does not wash out the UI.
theme_background = True

#* Sets if 24-bit truecolor should be used, will convert 24-bit colors to 256 color (6x6x6 color cube) if false.
truecolor = True

#* Set to true to force tty mode regardless if a real tty has been detected or not.
#* Will force 16-color mode and TTY theme, set all graph symbols to "tty" and swap out other non tty friendly symbols.
force_tty = False

#* Define presets for the layout of the boxes. Preset 0 is always all boxes shown with default settings. Max 9 presets.
#* Format: "box_name:P:G,box_name:P:G" P=(0 or 1) for alternate positions, G## for graph height (max 5 characters).
presets = "cpu:0:default,proc:0:default mem:0:default,net:0:default"

#* Set to True to enable "h,j,k,l,g,G" keys for navigation. (Vim keys)
vim_keys = True

#* Rounded corners on boxes, is ignored if TTY mode is ON.
rounded_corners = True

#* Default symbols to use for graph creation, "braille", "block" or "tty".
#* block is more reliable in Cursor's integrated terminal than braille.
graph_symbol = "block"

# Graph symbol to use for graphs in cpu box, "default", "braille", "block" or "tty".
graph_symbol_cpu = "default"

# Graph symbol to use for graphs in mem box, "default", "braille", "block" or "tty".
graph_symbol_mem = "default"

# Graph symbol to use for graphs in net box, "default", "braille", "block" or "tty".
graph_symbol_net = "default"

# Graph symbol to use for graphs in proc box, "default", "braille", "block" or "tty".
graph_symbol_proc = "default"

#* Manually set which boxes to show. Available values are "cpu mem net proc" and "gpu0" through "gpu5", separate values with whitespace.
shown_boxes = "cpu mem net proc"

#* Update time in milliseconds, recommended 2000 ms or above for better sample times for graphs.
update_ms = 2000

#* Processes sorting, "pid" "program" "arguments" "threads" "user" "memory" "cpu lazy" "cpu direct",
#* "cpu lazy" sorts by the process CPU usage displayed, "cpu direct" sorts by the actual current CPU usage (slower but more accurate).
proc_sorting = "cpu lazy"

#* Reverse sorting order, True or False.
proc_reversed = False

#* Show processes as a tree.
proc_tree = False

#* Use the cpu graph colors in the process list.
proc_colors = True

#* Use a darkening gradient in the process list.
proc_gradient = True

#* If process cpu usage should be of the core it's running on or total of all cores.
proc_per_core = False

#* Show process memory as bytes instead of percent.
proc_mem_bytes = True

#* Show cpu graph for each process.
proc_cpu_graphs = True

#* Use /proc/[pid]/smaps for memory information in the process info box (very slow but more accurate)
proc_info_smaps = False

#* Show proc box on left side of screen instead of right.
proc_left = False

#* (Linux) Filter processes tied to the Linux kernel (similar to htop's "Hide kernel threads")
proc_filter_kernel = False

#* Sets the CPU stat shown in the upper half of the CPU graph, "total" is always available.
#* Select from a list of available stats from your system: "user" "nice" "system" "idle" "iowait" "irq" "softirq" "steal" "guest" "guest_nice"
cpu_graph_upper = "total"

#* Sets the CPU stat shown in the lower half of the CPU graph, "total" is always available.
#* Select from a list of available stats from your system: "user" "nice" "system" "idle" "iowait" "irq" "softirq" "steal" "guest" "guest_nice"
cpu_graph_lower = "total"

#* Toggles if the lower CPU graph should be inverted.
cpu_invert_lower = True

#* Set to True to completely disable the lower CPU graph.
cpu_single_graph = False

#* Show cpu box at bottom of screen instead of top.
cpu_bottom = False

#* Shows the system uptime in the CPU box.
show_uptime = True

#* Show cpu temp and graph on left side of cpu box.
check_temp = True

#* Which sensor to use for cpu temperature.
#* Use "Auto" to auto-detect or "0", "1"... or the full string name: "Core 0"
cpu_sensor = "Auto"

#* Show temperatures for cpu cores also if check_temp is True and sensors has been found.
show_coretemp = True

#* Set a custom min temp for the cpu temp graph
cpu_core_map = ""

#* Which temperature scale to use, available values: "celsius", "fahrenheit", "kelvin" and "rankine".
temp_scale = "celsius"

#* Use base 10 for bits/bytes sizes, 10^3 = 1000 instead of 2^10 = 1024.
base_10_sizes = False

#* Show CPU frequency.
show_cpu_freq = True

#* Draw a clock at top of screen, formatting according to strftime, empty string to disable.
clock_format = "%X"

#* Update main ui in background when menus are showing, set this to false if the menus is flickering too much for comfort.
background_update = True

#* Custom cpu model name, empty string to disable.
custom_cpu_name = ""

#* Optional filter for cpu temperatures, include any strings to only return matching sensors.
disks_filter = ""

#* Show disks mode instead of memory box.
show_disks = True

#* Filter out non physical disks. Set this to False to include network disks, RAM disks and similar.
only_physical = True

#* Read disks IO from /proc/diskstats with more accuracy, this makes IO readings on a per disk basis, set to False to make a single syswide disk IO reading.
io_mode = False

#* Set to True to show IO activity only when other data is displayed.
io_graph_combined = False

#* Set the top speed for the io graph in MiB/s (100 by default), use format "mountpoint:speed" separate disks with whitespace " ".
io_graph_speeds = ""

#* Set fixed values for network graphs in MiB/s, default "10M" = 10 MiB/s. Possible units: (K)ilo(B)ytes, (M)ega(B)ytes, (G)iga(B)ytes.
#* Using "0" for auto scale and suffix with "!" to use these as max values.
net_download = "100M"

#* Set fixed values for network graphs in MiB/s, default "10M" = 10 MiB/s. Possible units: (K)ilo(B)ytes, (M)ega(B)ytes, (G)iga(B)ytes.
#* Using "0" for auto scale and suffix with "!" to use these as max values.
net_upload = "100M"

#* Start in network graphs auto scale mode, as if it was toggled with the "a" key.
net_auto = True

#* Sync the auto scaling of upload and download graphs (default True), set to false for auto scaling independently.
net_sync = True

#* Manually set which network interface to use, leave empty for auto detection.
net_iface = ""

#* Show battery stats in top right corner if a battery is present.
show_battery = True

#* Which battery to display if more than one is found.
selected_battery = "Auto"

#* Set loglevel for "~/.config/btop/btop.log" levels are: "ERROR" "WARNING" "INFO" "DEBUG".
#* The level set includes all lower levels, i.e. "DEBUG" will show all logging info.
log_level = "WARNING"
