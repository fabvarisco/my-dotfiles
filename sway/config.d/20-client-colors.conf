# Windows start without a title bar. inactive-opacity.py draws a 2px
# gray frame on the focused window only.
# client.<class> <border> <background> <text> <indicator> <child_border>
default_border none
default_floating_border none

client.focused          #888888 #000000 #C8C8C8 #C8C8C8 #888888
client.focused_inactive #888888 #000000 #969696 #555555 #888888
client.unfocused        #000000 #000000 #707070 #000000 #000000
client.urgent           #FF6464 #000000 #C8C8C8 #FF6464 #FF6464
client.placeholder      #000000 #000000 #C8C8C8 #000000 #000000
client.background       #000000
