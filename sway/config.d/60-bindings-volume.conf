# Volume keys go through Noctalia so the shell OSD stays in sync.
# Mic mute stays on pactl; Noctalia's volume IPC targets the default sink.

bindsym --locked {
    XF86AudioRaiseVolume exec ~/.nix-profile/bin/noctalia msg volume-up
    XF86AudioLowerVolume exec ~/.nix-profile/bin/noctalia msg volume-down
    XF86AudioMute exec ~/.nix-profile/bin/noctalia msg volume-mute
    XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle
}
