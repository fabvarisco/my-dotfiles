# Idle and lock configuration
#
# This will lock your screen after 300 seconds of inactivity, then turn off
# your displays after another 60 seconds, and turn your screens back on when
# resumed. It will also lock your screen before your computer goes to sleep.
# The timeouts can be customized via `$lock_timeout` and `$screen_timeout`
# variables. For a predictable behavior, keep the `$screen_timeout` value
# lesser than the `$lock_timeout`.
#
# Super+l locks. Focus right stays on Super+Right.
bindsym $mod+l exec loginctl lock-session
#
# The locker is swaylock-effects from the Nix profile. Its binary is
# also named swaylock. Fedora's /usr/bin/swaylock ignores the clock and
# the blur, and rejects those keys in ~/.config/swaylock/config.
# The dnf package stays installed: it provides /etc/pam.d/swaylock.
#
# Requires: swayidle
# Requires: ~/.nix-profile/bin/swaylock
# Requires: /usr/bin/pkill, /usr/bin/pgrep

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT '"$HOME/.nix-profile/bin/swaylock" -f' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"'  \
        timeout $ST 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"'  \
        before-sleep '"$HOME/.nix-profile/bin/swaylock" -f' \
        lock '"$HOME/.nix-profile/bin/swaylock" -f' \
        unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'
