# Region capture opens Noctalia's annotation editor (arrow, text, blur, crop).
# PNGs go to XDG Pictures and the clipboard.

bindsym {
    $mod+Shift+s exec ~/.nix-profile/bin/noctalia msg screenshot-region
    $mod+Print exec ~/.nix-profile/bin/noctalia msg screenshot-fullscreen
    Ctrl+Print  exec ~/.nix-profile/bin/noctalia msg screenshot-annotate
}
